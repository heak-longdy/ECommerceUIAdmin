<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dialog Test</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { 
            padding: 10px 20px; 
            margin: 10px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
        }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div x-data="dropdown">
        <h1>Dialog Component Test</h1>
        
        <button @click="showDeleteConfirmation('12345', 'Test Order')">
            Show Delete Dialog
        </button>
        
        <button @click="showArchiveConfirmation('12345', 'Test Order')">
            Show Archive Dialog
        </button>
        
        <button @click="showCompleteConfirmation('12345', 'Test Order')">
            Show Complete Dialog
        </button>
        
        <button @click="showRefundConfirmation('12345', 'Test Order')">
            Show Refund Dialog
        </button>
        
        <!-- Include the dialog component -->
        <template x-if="showDeleteDialog">
        <div 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="fixed inset-0 z-[9999] flex items-center justify-center showDialog"
             style="background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);">
            
            <div @click.away="cancelDelete()" 
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 transform scale-90 translate-y-4"
                 x-transition:enter-end="opacity-100 transform scale-100 translate-y-0"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100 transform scale-100 translate-y-0"
                 x-transition:leave-end="opacity-0 transform scale-90 translate-y-4"
                 style="
                    background: #ffffff;
                    border-radius: 16px;
                    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 8px 32px rgba(0, 0, 0, 0.2);
                    max-width: 450px;
                    width: 90%;
                    margin: 20px;
                    overflow: hidden;
                    border: 1px solid rgba(255, 255, 255, 0.2);
                 ">
                
                <!-- Dialog Header -->
                <div style="padding: 32px 32px 20px 32px; text-align: center; background: linear-gradient(135deg, #fee2e2 0%, #fef2f2 100%);">
                    <div style="width: 64px; height: 64px; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto;">
                        <span class="material-symbols-outlined" style="color: white; font-size: 28px;" x-text="dialogConfig?.headerIcon || 'delete'"></span>
                    </div>
                    <h3 style="font-size: 24px; font-weight: 600; color: #1f2937; margin: 0 0 8px 0;" x-text="dialogConfig?.title || 'Delete Order'"></h3>
                    <p style="color: #6b7280; font-size: 16px; margin: 0;" x-text="dialogConfig?.description || 'Are you sure you want to permanently delete this order?'"></p>
                </div>
                
                <!-- Actions -->
                <div style="padding: 24px 32px; display: flex; gap: 12px; justify-content: flex-end;">
                    <button @click="cancelDelete()" style="padding: 12px 24px; background: #f9fafb; border: 1px solid #d1d5db; border-radius: 8px; cursor: pointer;">
                        Cancel
                    </button>
                    <button @click="confirmAction()" style="padding: 12px 24px; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; border: none; border-radius: 8px; cursor: pointer;">
                        <span x-text="dialogConfig?.primaryText || 'Delete'"></span>
                    </button>
                </div>
            </div>
        </div>
        </template>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('dropdown', () => ({
                showDeleteDialog: false,
                itemToDelete: null,
                dialogConfig: {},
                
                // Generic dialog method
                showDialog(config) {
                    this.dialogConfig = config;
                    this.itemToDelete = { id: config.itemId, name: config.itemName };
                    this.showDeleteDialog = true;
                },
                
                // Specific dialog methods
                showDeleteConfirmation(orderId, orderName) {
                    this.showDialog({
                        itemId: orderId,
                        itemName: orderName,
                        title: 'Delete Order',
                        description: 'Are you sure you want to permanently delete this order?',
                        headerIcon: 'delete',
                        primaryText: 'Delete Order',
                        action: 'delete'
                    });
                },
                
                showArchiveConfirmation(orderId, orderName) {
                    this.showDialog({
                        itemId: orderId,
                        itemName: orderName,
                        title: 'Archive Order',
                        description: 'This order will be moved to archive. You can restore it later.',
                        headerIcon: 'archive',
                        primaryText: 'Archive',
                        action: 'archive'
                    });
                },
                
                showCompleteConfirmation(orderId, orderName) {
                    this.showDialog({
                        itemId: orderId,
                        itemName: orderName,
                        title: 'Mark as Complete',
                        description: 'Mark this order as completed and notify the customer?',
                        headerIcon: 'check_circle',
                        primaryText: 'Mark Complete',
                        action: 'complete'
                    });
                },
                
                showRefundConfirmation(orderId, orderName) {
                    this.showDialog({
                        itemId: orderId,
                        itemName: orderName,
                        title: 'Process Refund',
                        description: 'Process a full refund for this order? The payment will be reversed.',
                        headerIcon: 'currency_exchange',
                        primaryText: 'Process Refund',
                        action: 'refund'
                    });
                },
                
                confirmAction() {
                    const action = this.dialogConfig.action;
                    alert(`${action} action confirmed for order ${this.itemToDelete.id}!`);
                    this.cancelDelete();
                },
                
                cancelDelete() {
                    this.showDeleteDialog = false;
                    this.itemToDelete = null;
                    this.dialogConfig = {};
                }
            }))
        })
    </script>
</body>
</html>
