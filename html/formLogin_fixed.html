<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"/>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #fff;
      font-family: 'Inter', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .main-wrapper {
      display: flex;
      width: 1120px;
      height: 650px;
      background: #fff;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
    }
    .sidebar {
      width: 70px;
      background: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0;
      gap: 0;
      z-index: 10;
          justify-content: center;
    }
    .sidebar .close {
      color: #3366ff;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
      user-select: none;
      line-height: 1;
    }
    .sidebar .pill {
      background: #3366ff;
      border-radius: 20px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .sidebar .icon-btn {
      width: 40px;
      height: 40px;
      background: transparent;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .sidebar .icon-btn:hover {
      background: rgba(255,255,255,0.1);
    }
    .sidebar .pill {
          display: flex
;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #2563eb;
    border-radius: 50px;
    padding: 5px;
    gap: 5px;
    }
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
          padding: 0 60px 0px 110px;
      background: #fff;
    }
    .content h1 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1a1a1a;
      letter-spacing: -0.5px;
    }
    .content p {
      color: #666;
      margin-bottom: 32px;
      font-size: 16px;
      font-weight: 400;
    }
    .form {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .input-group {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-group input {
      width: 100%;
      padding: 16px 44px 16px 16px;
      border: none;
      border-radius: 15px;
      background: #f5f5f5;
      font-size: 15px;
      box-shadow: none;
      outline: none;
      transition: all 0.2s;
      font-family: 'Inter', Arial, sans-serif;
    }
    .input-group input:focus {
      background: #f0f0f0;
    }
    .input-group .input-icon {
      position: absolute;
      right: 16px;
      color: #999;
      font-size: 16px;
      cursor: pointer;
    }
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #666;
      margin-top: -4px;
      margin-bottom: 8px;
    }
    .form-options label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 400;
    }
    .form-options input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #3366ff;
    }
    .form-options a {
      color: #666;
      text-decoration: none;
      font-weight: 400;
      transition: color 0.2s;
    }
    .form-options a:hover {
      color: #3366ff;
    }
    .form .sign-in-btn {
      background: #3366ff;
      color: #fff;
      border: none;
      border-radius: 15px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 24px;
      cursor: pointer;
      transition: background 0.2s;
      font-family: 'Inter', Arial, sans-serif;
    }
    .form .sign-in-btn:hover {
      background: #2252cc;
    }
    .social-btn {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 14px;
      font-size: 15px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s;
      justify-content: center;
      font-family: 'Inter', Arial, sans-serif;
    }
    .social-btn.google {
      background: #fff;
      color: #333;
      border: 1px solid #ddd;
    }
    .social-btn.google:hover {
      background: #f9f9f9;
    }
    .social-btn.apple, .social-btn.x {
      background: #000;
      color: #fff;
    }
    .social-btn.apple:hover, .social-btn.x:hover {
      background: #333;
    }
    .right-section {
      flex: 1.2;
      position: relative;
      background: #fff;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      padding: 10px;
    }
    .testimonial-card {
      width: 100%;
      height: 100%;
      background: url('https://images.unsplash.com/photo-1519125323398-675f0ddb6308?auto=format&fit=crop&w=800&q=80') center center/cover no-repeat;
      position: relative;
      border-radius: 25px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .testimonial-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(110deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.4) 45%, rgba(255,255,255,0.0) 75%);
      pointer-events: none;
    }
    .testimonial-content {
      position: relative;
      z-index: 2;
      color: #fff;
      padding: 0 32px 32px 32px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
    .testimonial-content p {
      font-size: 18px;
      margin-bottom: 16px;
      font-weight: 400;
      line-height: 1.4;
    }
    .testimonial-content .names {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 4px;
    }
    .testimonial-content .role {
      font-size: 14px;
      font-weight: 400;
      opacity: 0.9;
    }
    .testimonial-nav {
      position: absolute;
      right: 32px;
      bottom: 24px;
      display: flex;
      gap: 12px;
      z-index: 3;
    }
    .testimonial-nav button {
      background: rgba(255,255,255,0.8);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #333;
      cursor: pointer;
      transition: background 0.2s;
    }
    .testimonial-nav button:hover {
      background: rgba(255,255,255,0.95);
    }
    @media (max-width: 1100px) {
      .main-wrapper { flex-direction: column; width: 98vw; height: auto; min-height: 100vh; border-radius: 0; }
      .sidebar { flex-direction: row; width: 100%; height: 60px; padding: 0 16px; }
      .content, .right-section { padding: 24px; }
      .testimonial-content { padding: 0 18px 18px 18px; }
    }
  </style>
</head>
<body>
  <div class="main-wrapper">
    <div class="sidebar">
      <span class="close">&times;</span>
      <div class="pill">
        <button class="icon-btn"><i class="fa fa-arrow-left"></i></button>
        <button class="icon-btn"><i class="fa fa-user-group"></i></button>
        <button class="icon-btn"><i class="fa fa-gear"></i></button>
      </div>
    </div>
    <div class="content">
      <h1>Welcome back!</h1>
      <p>Please enter your details to sign in.</p>
      <form class="form">
        <div class="input-group">
          <input type="email" placeholder="christina.hayes@mortgagex.com" value="christina.hayes@mortgagex.com">
          <span class="input-icon"><i class="fa fa-envelope"></i></span>
        </div>
        <div class="input-group">
          <input type="password" placeholder="Enter your password">
          <span class="input-icon"><i class="fa fa-eye-slash"></i></span>
        </div>
        <div class="form-options">
          <label><input type="checkbox"> Remember for 30 days</label>
          <a href="#">Forgot password?</a>
        </div>
        <button class="sign-in-btn" type="submit">Sign in</button>
        <div class="divider"></div>
        <button class="social-btn google" type="button"><i class="fab fa-google"></i>Sign in with Google</button>
        <button class="social-btn apple" type="button"><i class="fab fa-apple"></i>Sign in with Apple</button>
        <button class="social-btn x" type="button"><i class="fab fa-x-twitter"></i>Sign in with X</button>
      </form>
    </div>
    <div class="right-section">
      <div class="testimonial-card">
        <div class="testimonial-overlay"></div>
        <div class="testimonial-content">
          <p>“MortgageX has saved us thousands of hours of work. We’re able to spin up mortgage loans faster and take on more clients.”</p>
          <div class="names">Lulu & Chris Meyers</div>
          <div class="role">Co-Founders, LandWise</div>
        </div>
        <div class="testimonial-nav">
          <button><i class="fa fa-arrow-left"></i></button>
          <button><i class="fa fa-arrow-right"></i></button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
