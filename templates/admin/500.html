{% extends "base.html" %}

{% block title %}Server Error - Ecommerce{% endblock %}
{% block headerTitle %}500 - Server Error{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-content">
        <div class="error-icon">
            <span class="material-symbols-outlined">warning</span>
        </div>
        
        <h1>500</h1>
        <h2>Internal Server Error</h2>
        <p>Something went wrong on our end. Please try again later.</p>
        
        <div class="error-actions">
            <a href="{{ url_for('index') }}" class="btn-primary">
                <span class="material-symbols-outlined">refresh</span>
                Try Again
            </a>
            <a href="{{ url_for('index') }}" class="btn-secondary">
                <span class="material-symbols-outlined">home</span>
                Go Home
            </a>
        </div>
    </div>
</div>

<style>
.error-container {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    padding: 40px 20px;
}

.error-content {
    text-align: center;
    max-width: 500px;
}

.error-icon {
    font-size: 4rem;
    color: #f59e0b;
    margin-bottom: 20px;
}

.error-content h1 {
    font-size: 6rem;
    font-weight: bold;
    color: #1f2937;
    margin: 0;
    line-height: 1;
}

.error-content h2 {
    font-size: 1.5rem;
    color: #6b7280;
    margin: 10px 0;
}

.error-content p {
    color: #9ca3af;
    margin-bottom: 30px;
    font-size: 1.1rem;
}

.error-actions {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
}

.btn-primary, .btn-secondary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.2s;
}

.btn-primary {
    background: #f59e0b;
    color: white;
}

.btn-primary:hover {
    background: #d97706;
    color: white;
    text-decoration: none;
}

.btn-secondary {
    background: #f1f5f9;
    color: #475569;
    border: 1px solid #e2e8f0;
}

.btn-secondary:hover {
    background: #e2e8f0;
    color: #334155;
    text-decoration: none;
}
</style>
{% endblock %}
