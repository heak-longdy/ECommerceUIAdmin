<!-- Custom Delete Confirmation Dialog Component -->

<template x-data="{}" x-if="$store.DialogAddCart.showAddCartDialog">
    
    <div
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="fixed inset-0 z-[9999] flex items-center justify-center showDialog"
        style="background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(1px);    position: fixed;
    top: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: flex-end; z-index: 9999;"
        x-data="xDialogAddCart">

        <style>
        .imgCart{
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 15px;
        }
        .cartItem{
            display: flex;
            align-items: center;
            grid-gap: 10px;
            margin-bottom: 15px;
        }
        .cartFooter{
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            height: 70px;
            align-items: center;
            padding: 0 15px;
        }
        .cartFooter>button{
            height: 43px;
            font-size: 14px;
            padding: 0 19px 0 15px;
            font-weight: 500;
             border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgb(209, 213, 219);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cartFooter>.close{
            color: rgb(55, 65, 81);
            background: rgb(249, 250, 251);
        }
        .cartFooter>.viewCart{
            color: white;
            background: linear-gradient(135deg, #4CAF50 0%, #4CAF50 100%);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }
        .cartFooter>button>i{
            font-size: 23px;
        }
    </style>

        <div @click.away=""
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 transform scale-90 translate-y-4"
            x-transition:enter-end="opacity-100 transform scale-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 transform scale-100 translate-y-0"
            x-transition:leave-end="opacity-0 transform scale-90 translate-y-4"
            style="
                background: #ffffff;
    border-radius: 15px 0 0 15px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 8px 32px rgba(0, 0, 0, 0.2);
    max-width: 450px;
    width: 90%;
    margin: 0px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.2);
    display: flex;
    flex-direction: column;
         ">
        <div style="height: 60px;display: flex;align-items: center;padding:0 15px;">
            <h3>Add Cart</h3>
        </div>
        <div style="padding: 15px;    flex: 1;">
             <template x-for="item in dataCart" :key="item.id">
                <div class="cartItem">
                    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTF8fHByb2R1Y3R8ZW58MHx8MHx8fDA%3D" class="imgCart"/>
                    <div>
                        <div style="display: flex;grid-gap: 10px;">
                            <p x-text="item.qty + ' X'"></p>
                            <p x-text="item.name"></p>
                        </div>
                        <div style="display: flex;grid-gap: 10px;">
                            <p x-text="item.price + '$'"></p>
                        </div>
                        <button style="    width: 25px;
    height: 25px;
    font-size: 21px;
    margin-top: 15px;
    background: none;
    border: none;
    color: red;" @click="deleteCartItem(item.id)"><i class='bx bx-trash-alt'></i></button>
                    </div>
                </div>
            </template>
        </div>

            <!-- Dynamic Dialog Actions -->
            <div class="cartFooter">
                <!-- Cancel Button -->
                <button @click="close()" class="close"
                    onmouseover="this.style.background='#f3f4f6'; this.style.borderColor='#9ca3af'"
                    onmouseout="this.style.background='#f9fafb'; this.style.borderColor='#d1d5db'">
                    <i class='bx bx-x'></i> 
                    <span x-text="'Cancel'"></span>
                </button>

                <!-- Primary Action Button -->
                <button @click="confirmAction()"
                    class="viewCart"
                    onmouseover="this.style.transform='translateY(-1px)'"
                    onmouseout="this.style.transform='translateY(0)'">
                    <i class='bx bx-eye'></i>
                    <span x-text="'View Cart'"></span>
                </button>
            </div>

            <!-- Close Button (X) -->
            <!-- <button @click="close()"
                style="
                    position: absolute;
                    top: 16px;
                    right: 16px;
                    width: 32px;
                    height: 32px;
                    background: rgba(0, 0, 0, 0.1);
                    border: none;
                    border-radius: 50%;
                    cursor: pointer;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    transition: all 0.2s;
                "
                onmouseover="this.style.background='rgba(0, 0, 0, 0.2)'"
                onmouseout="this.style.background='rgba(0, 0, 0, 0.1)'">
                <span class="material-symbols-outlined" style="
                color: #6b7280;
                font-size: 18px;
            ">close</span>
            </button> -->
        </div>

    </div>
</template>
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.store('DialogAddCart', {
            active: false,
            showAddCartDialog: false,
            dataCart: [],
            options: {
                data: null,
                selected: null,
                multiple: false,
                title: 'Choose an option',
                placeholder: 'Type to search...',
                allow_close: true,
                onReady: () => {},
                onSearch: () => {},
                // beforeClose: () => {},
                afterClose: () => {}
            }
        });
    });

    document.addEventListener('alpine:init', () => {
        Alpine.data('xDialogAddCart', () => ({
            dialogConfig: {},
            itemToDelete: null,
            dataCart: [],
            init() {
                this.dataCart = Alpine.store('DialogAddCart')?.dataCart || [];
                console.log(Alpine.store('DialogAddCart'),"dataCart 222222222@@@");
                this.dialogConfig = Alpine.store('DialogAddCart').options;
                this.itemToDelete = Alpine.store('DialogAddCart').options.data;
            },

            confirmAction() {
                if (this.dialogConfig.action) {
                    this.$dispatch('dialog-confirm', { action: this.dialogConfig.action, data: this.itemToDelete });
                }
                Alpine.store('DialogAddCart').showAddCartDialog = false;
            },

            cancelDelete() {
                Alpine.store('DialogAddCart').showAddCartDialog = false;
            },
            close(data = null) {
                this.$store.DialogAddCart.showAddCartDialog = false;
                this.$store.DialogAddCart.options.afterClose(data);
            },
            deleteCartItem(orderId) {
                console.log("orderId", orderId);
                // Find the index of the item with the specified orderId
                const itemIndex = this.dataCart.findIndex(item => item.id === orderId);

                if (itemIndex !== -1) {
                    // Remove the item from the dataCart
                    this.dataCart.splice(itemIndex, 1);

                    // Save the updated cart back to localStorage
                    localStorage.setItem('cart', JSON.stringify(this.dataCart));

                    console.log('Item deleted. Updated cart:', this.dataCart);
                } else {
                    console.log('Item not found in cart:', orderId);
                }
            }

        }));
    });

    window.SelectOption = (options) => {
        Alpine.store('DialogAddCart', {
            active: true,
            showAddCartDialog: true,
            dataCart : options?.dataCart || [],
            options: {
                ...Alpine.store('DialogAddCart').options,
                ...options
            }
        });
    };
</script>
