<!-- Custom Delete Confirmation Dialog Component -->

<template x-data="{}" x-if="$store.DialogDelete.showDeleteDialog">
    <div
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="fixed inset-0 z-[9999] flex items-center justify-center showDialog"
        style="background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);"
        x-data="xDialogDelete">

        <div @click.away=""
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 transform scale-90 translate-y-4"
            x-transition:enter-end="opacity-100 transform scale-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 transform scale-100 translate-y-0"
            x-transition:leave-end="opacity-0 transform scale-90 translate-y-4"
            style="
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 8px 32px rgba(0, 0, 0, 0.2);
            max-width: 450px;
            width: 90%;
            margin: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
         ">

            <!-- Dialog Header with Icon -->
            <div style="
            padding: 32px 32px 20px 32px;
            text-align: center;
            background: linear-gradient(135deg, #fee2e2 0%, #fef2f2 100%);
            border-bottom: 1px solid rgba(239, 68, 68, 0.1);
        ">
                <div :style="{
                width: '64px',
                height: '64px',
                background: 'linear-gradient(135deg, #ef4444 0%, #dc2626 100%)',
                borderRadius: '50%',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                margin: '0 auto 16px auto',
                boxShadow: '0 8px 24px rgba(239, 68, 68, 0.3)'
            }">
                    <span class="material-symbols-outlined" :style="{
                    color: 'white',
                    fontSize: '28px',
                    fontWeight: '500'
                }" x-text="'delete'"></span>
                </div>

                <h3 style="
                font-size: 24px;
                font-weight: 600;
                color: #1f2937;
                margin: 0 0 8px 0;
                letter-spacing: -0.025em;
            " x-text="'Delete Order'"></h3>

                <p style="
                color: #6b7280;
                font-size: 16px;
                margin: 0;
                line-height: 1.5;
            "
                    x-text="'Are you sure you want to permanently delete this order?'"></p>
            </div>

            <!-- Dialog Content -->
            <div style="padding: 24px 32px;">
                <!-- Order Details Card -->
                <div style="
                background: #f9fafb;
                border: 1px solid #e5e7eb;
                border-radius: 12px;
                padding: 20px;
                margin-bottom: 24px;
            ">
                    <div style="
                    display: flex;
                    align-items: center;
                    margin-bottom: 12px;
                ">
                        <span class="material-symbols-outlined" style="
                        color: #6b7280;
                        font-size: 20px;
                        margin-right: 8px;
                    ">receipt_long</span>
                        <span style="
                        font-weight: 600;
                        color: #374151;
                        font-size: 16px;
                    ">Order Details</span>
                    </div>

                    <div style="
                    background: white;
                    border-radius: 8px;
                    padding: 16px;
                    border-left: 4px solid #ef4444;
                ">
                        <p style="
                        margin: 0 0 8px 0;
                        font-size: 18px;
                        font-weight: 600;
                        color: #1f2937;
                    " x-text="'Unknown Order'"></p>

                        <p style="
                        margin: 0;
                        font-size: 14px;
                        color: #6b7280;
                    ">ID: <span x-text="'N/A'" style="
                        font-family: monospace;
                        background: #f3f4f6;
                        padding: 2px 6px;
                        border-radius: 4px;
                    "></span></p>
                    </div>
                </div>

                <!-- Warning Message -->
                <div style="
                background: linear-gradient(135deg, #fef3c7 0%, #fef7cd 100%);
                border: 1px solid #f59e0b;
                border-radius: 12px;
                padding: 16px;
                margin-bottom: 24px;
                display: flex;
                align-items: flex-start;
            ">
                    <span class="material-symbols-outlined" style="
                    color: #d97706;
                    font-size: 20px;
                    margin-right: 12px;
                    margin-top: 2px;
                ">warning</span>
                    <div>
                        <p style="
                        margin: 0 0 4px 0;
                        font-weight: 600;
                        color: #92400e;
                        font-size: 14px;
                    ">This action cannot be undone</p>
                        <p style="
                        margin: 0;
                        color: #92400e;
                        font-size: 13px;
                        line-height: 1.4;
                    ">The order and all associated data will be permanently
                            removed from the system.</p>
                    </div>
                </div>
            </div>

            <!-- Dynamic Dialog Actions -->
            <div style="
            padding: 0 32px 32px 32px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        ">
                <!-- Cancel Button -->
                <button @click="close()"
                    style="
                        padding: 12px 24px;
                        font-size: 14px;
                        font-weight: 500;
                        color: #374151;
                        background: #f9fafb;
                        border: 1px solid #d1d5db;
                        border-radius: 8px;
                        cursor: pointer;
                        transition: all 0.2s;
                        display: flex;
                        align-items: center;
                        gap: 8px;
                    "
                    onmouseover="this.style.background='#f3f4f6'; this.style.borderColor='#9ca3af'"
                    onmouseout="this.style.background='#f9fafb'; this.style.borderColor='#d1d5db'">
                    <span class="material-symbols-outlined"
                        style="font-size: 16px;"
                        x-text="'close'"></span>
                    <span x-text="'Cancel'"></span>
                </button>

                <!-- Primary Action Button -->
                <button @click="confirmAction()"
                    :style="{
                        padding: '12px 24px',
                        fontSize: '14px',
                        fontWeight: '500',
                        color: 'white',
                        background: 'linear-gradient(135deg, #ef4444 0%, #dc2626 100%)',
                        border: 'none',
                        borderRadius: '8px',
                        cursor: 'pointer',
                        transition: 'all 0.2s',
                        display: 'flex',
                        alignItems: 'center',
                        gap: '8px',
                        boxShadow: '0 4px 12px rgba(239, 68, 68, 0.3)'
                    }"
                    onmouseover="this.style.transform='translateY(-1px)'"
                    onmouseout="this.style.transform='translateY(0)'">
                    <span class="material-symbols-outlined"
                        style="font-size: 16px;"
                        x-text="'delete'"></span>
                    <span x-text="'Delete'"></span>
                </button>

                <!-- Additional Action Buttons (Optional) -->
                <template
                    x-for="button in ([])"
                    :key="button.id">
                    <button @click="handleAdditionalAction(button.action)"
                        :style="{
                            padding: '12px 24px',
                            fontSize: '14px',
                            fontWeight: '500',
                            color: button.textColor || 'white',
                            background: button.background || '#6b7280',
                            border: button.border || 'none',
                            borderRadius: '8px',
                            cursor: 'pointer',
                            transition: 'all 0.2s',
                            display: 'flex',
                            alignItems: 'center',
                            gap: '8px',
                            boxShadow: button.shadow || '0 4px 12px rgba(107, 114, 128, 0.3)'
                        }">
                        <span class="material-symbols-outlined"
                            style="font-size: 16px;"
                            x-text="button.icon"></span>
                        <span x-text="button.text"></span>
                    </button>
                </template>
            </div>

            <!-- Close Button (X) -->
            <!-- <button @click="close()"
                style="
                    position: absolute;
                    top: 16px;
                    right: 16px;
                    width: 32px;
                    height: 32px;
                    background: rgba(0, 0, 0, 0.1);
                    border: none;
                    border-radius: 50%;
                    cursor: pointer;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    transition: all 0.2s;
                "
                onmouseover="this.style.background='rgba(0, 0, 0, 0.2)'"
                onmouseout="this.style.background='rgba(0, 0, 0, 0.1)'">
                <span class="material-symbols-outlined" style="
                color: #6b7280;
                font-size: 18px;
            ">close</span>
            </button> -->
        </div>

    </div>
</template>
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.store('DialogDelete', {
            active: false,
            showDeleteDialog: false,
            options: {
                data: null,
                selected: null,
                multiple: false,
                title: 'Choose an option',
                placeholder: 'Type to search...',
                allow_close: true,
                onReady: () => {},
                onSearch: () => {},
                // beforeClose: () => {},
                afterClose: () => {}
            }
        });
    });

    document.addEventListener('alpine:init', () => {
        Alpine.data('xDialogDelete', () => ({
            dialogConfig: {},
            itemToDelete: null,

            init() {
                console.log('gdgdgd@111111');
                this.dialogConfig = Alpine.store('DialogDelete').options;
                this.itemToDelete = Alpine.store('DialogDelete').options.data;
            },

            confirmAction() {
                if (this.dialogConfig.action) {
                    this.$dispatch('dialog-confirm', { action: this.dialogConfig.action, data: this.itemToDelete });
                }
                Alpine.store('DialogDelete').showDeleteDialog = false;
            },

            cancelDelete() {
                Alpine.store('DialogDelete').showDeleteDialog = false;
            },
            close(data = null) {
                this.$store.DialogDelete.showDeleteDialog = false;
                this.$store.DialogDelete.options.afterClose(data);
            }

        }));
    });

    window.SelectOption = (options) => {
        Alpine.store('DialogDelete', {
            active: true,
            showDeleteDialog: true,
            options: {
                ...Alpine.store('DialogDelete').options,
                ...options
            }
        });
    };
</script>
